/* ── Design System : Magic Meadow ── */
:root {
  --surface:    #fcfae4;
  --surf-low:   #f6f5df;
  --surf-mid:   #f1efd9;
  --surf-high:  #ebe9d4;

  --on-surf:    #1c1c0f;

  --radius-sm:  0.75rem;
  --radius-md:  1.25rem;
  --radius-lg:  2rem;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--surface);color:var(--on-surf);min-height:100vh;overflow-x:hidden;}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',sans-serif;}

/* Animations */
@keyframes springIn{0%{opacity:0;transform:scale(.4) rotate(-10deg)}60%{opacity:1;transform:scale(1.08) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes wobble{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-9deg) scale(1.12)}40%{transform:rotate(9deg) scale(1.12)}60%{transform:rotate(-5deg) scale(1.06)}80%{transform:rotate(5deg) scale(1.06)}}
@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes confettiFall{0%{opacity:1;transform:translateY(-20px) rotate(0)}100%{opacity:0;transform:translateY(110vh) rotate(720deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes jarFillAnim{from{height:0}to{height:var(--fill)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.spring-in{animation:springIn .5s cubic-bezier(.34,1.56,.64,1) forwards}
.wobble{animation:wobble 2.8s ease-in-out infinite}
.float-up{animation:floatUp 3s ease-in-out infinite}
.slide-up{animation:slideUp .4s ease forwards}
.pulse-glow{animation:pulseGlow 1.4s ease-in-out infinite}
.fade-in{animation:fadeIn .4s ease forwards}

/* Tappable card */
.tcard{cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .22s cubic-bezier(.34,1.56,.64,1);}
.tcard:active{transform:scale(.9) !important;}

/* Buttons */
.btn-gold{background:linear-gradient(45deg,var(--primary),var(--pd));color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;border:none;border-radius:var(--radius-full);cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 24px rgba(118,91,0,.3);}
.btn-gold:active{transform:scale(.95);box-shadow:none;}
.btn-teal{background:var(--sec-cnt);color:var(--secondary);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;border:none;border-radius:var(--radius-full);cursor:pointer;transition:transform .15s;}
.btn-teal:active{transform:scale(.95);}

/* Card */
.card{background:var(--white);border-radius:var(--radius-lg);box-shadow:0 4px 20px rgba(28,28,15,.06);}

/* Bottom nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(252,250,228,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:10px 16px 28px;display:flex;justify-content:space-around;align-items:center;z-index:200;border-top:1px solid rgba(199,196,155,.25);}

/* Scrollbar hide */
.noscroll::-webkit-scrollbar{display:none;}
.noscroll{-ms-overflow-style:none;scrollbar-width:none;}

const ELEVEN_KEY = "sk_c443c75ac1d31119253ec8cbe9a7a43f0c6cbb56a0307013";
const VOICE_ID   = "kwhMCf63M8O3rCfnQ3oQ"; // Caroline FR
const audioBuf = {};
let actx = null;
function getCtx(){ if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); return actx; }
async function speak(text){
  try{
    getCtx();
    let buf=audioBuf[text];
    if(!buf){
      const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`,{
        method:"POST",headers:{"xi-api-key":ELEVEN_KEY,"Content-Type":"application/json"},
        body:JSON.stringify({text,model_id:"eleven_multilingual_v2",voice_settings:{stability:.55,similarity_boost:.85,style:.2,use_speaker_boost:true}})
      });
      if(!r.ok) throw new Error();
      buf=await r.arrayBuffer();
      audioBuf[text]=buf;
    }
    const ctx=getCtx();
    const dec=await ctx.decodeAudioData(buf.slice(0));
    const src=ctx.createBufferSource();
    src.buffer=dec; src.connect(ctx.destination); src.start(0);
  } catch{
    const u=new SpeechSynthesisUtterance(text);
    u.lang="fr-FR"; u.rate=.85; u.pitch=1.1;
    window.speechSynthesis.speak(u);
  }
}

/* ── UTILS ───────────────────────────────────────── */
function todayKey(){ return new Date().toISOString().split('T')[0]; }
function monthKey(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()}`; }
function isWeekend(){ const d=new Date().getDay(); return d===0||d===6; }
function getDayName(){ return ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][new Date().getDay()]; }
function getActiveTab(){ const h=new Date().getHours(); if(h>=6&&h<12) return 'matin'; if(h>=12&&h<19) return 'retour'; return 'dodo'; }
function getHero(id){ return HEROES.find(h=>h.id===id)||HEROES[0]; }
function doneKey(pid,tab,tid){ return `${pid}_${todayKey()}_${tab}_${tid}`; }
function getTaskList(tab){ if(tab==='matin') return isWeekend()?'matin_weekend':'matin_semaine'; return tab; }

/* ── Firebase helpers ────────────────────────────── */
async function fbSave(col,docId,data){
  try{ await db.collection(col).doc(docId).set(data,{merge:true}); }catch(e){ console.warn('FB save error',e); }
}
async function fbLoad(col,docId){
  try{ const s=await db.collection(col).doc(docId).get(); return s.exists?s.data():null; }catch{ return null; }
}

// 2. Home Screen

    {key:'dodo',  label:'Dodo', emoji:'🌙', taskKey:'dodo'},
  ];

  function getProgress(t){
    const ts=TASKS[t.taskKey];
    const c=ts.filter(task=>done[doneKey(activeId,t.key,task.id)]).length;
    return {c,total:ts.length,pct:(c/ts.length)*100};

    <div style={{minHeight:'100vh',background:'var(--surface)',paddingBottom:100}} className="noscroll">

            const active=p.id===activeId;
            return(
              <div key={p.id} onClick={()=>{onSwitchProfile(p.id);speak(p.name);}} className="tcard" style={{

                borderRadius:'var(--radius-lg)',
                padding:'16px 24px',
                display:'flex',flexDirection:'column',alignItems:'center',gap:6,
                boxShadow:active?'0 8px 32px rgba(0,0,0,.12)':'none',
                border:active?`3px solid ${h.color}`:'3px solid transparent',
                transform:active?'scale(1.06)':'scale(.97)',
                transition:'all .3s cubic-bezier(.34,1.56,.64,1)',
                position:'relative',
              }}>
                <span style={{fontSize:54}}>{h.emoji}</span>
                <span style={{fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:800,fontSize:17,color:h.color}}>{p.name}</span>
                <span style={{fontSize:13,color:'#FFA000'}}>⭐ {pts[`${p.id}_${month}`]||0} pts</span>
                {active&&<button onClick={e=>{e.stopPropagation();onHeroChange(p.id);}} style={{
                  position:'absolute',bottom:-10,
                  background:'var(--primary)',color:'white',border:'none',
                  borderRadius:20,padding:'3px 10px',fontSize:11,cursor:'pointer',
                  fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,
                }}>Changer</button>}
              </div>
            );
          })}
        </div>

        {/* Greeting */}
        <div style={{textAlign:'center',marginBottom:20}}>
          <h1 style={{fontSize:26,fontWeight:800}}>Bonjour {profile.name} ! {hero.emoji}</h1>
          <p style={{color:'var(--on-var)',fontSize:14,marginTop:4}}>
            {getDayName()}{isWeekend()?' 🎉 Week-end !':''} — C'est parti !
          </p>
        </div>

        {/* Monthly progress card */}
        <div className="card" style={{padding:'16px 18px'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
            <span style={{fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:15}}>🗓️ Ce mois-ci</span>
            <span style={{color:'#FFA000',fontWeight:700}}>{monthPts} / {TARGET_PTS} ⭐</span>
          </div>
          <div style={{background:'var(--surf-mid)',borderRadius:20,height:16,overflow:'hidden'}}>
            <div style={{
              width:`${Math.min((monthPts/TARGET_PTS)*100,100)}%`,
              height:'100%',
              background:'linear-gradient(90deg,var(--primary),var(--pd))',
              borderRadius:20,transition:'width .8s ease',

      {/* Routine cards */}

/* ── APP ─────────────────────────────────────────── */
function App(){
  const [screen,    setScreen]    = useState('home');
  const [activeId,  setActiveId]  = useState('noe');
  const [profiles,  setProfiles]  = useState(PROFILES_DEF);
  const [done,      setDone]      = useState({});
  const [pts,       setPts]       = useState({});
  const [awarded,   setAwarded]   = useState({});
  const [celebrate, setCelebrate] = useState(false);
  const [heroFor,   setHeroFor]   = useState(null);
  const [loaded,    setLoaded]    = useState(false);
  const [customTasks,   setCustomTasks]   = useState({});
  const [scheduleHours, setScheduleHours] = useState({matin:[6,12],retour:[12,19],dodo:[19,23]});

  // Load from localStorage
  useEffect(()=>{
    try{const s=localStorage.getItem('rk_done_v3'); if(s) setDone(JSON.parse(s));}catch{}
    try{const s=localStorage.getItem('rk_pts_v3');  if(s) setPts(JSON.parse(s)); }catch{}
    try{const s=localStorage.getItem('rk_awd_v3');  if(s) setAwarded(JSON.parse(s));}catch{}
    try{const s=localStorage.getItem('rk_prof_v3');   if(s) setProfiles(JSON.parse(s));}catch{}
    try{const s=localStorage.getItem('rk_ctasks_v3'); if(s) setCustomTasks(JSON.parse(s));}catch{}
    try{const s=localStorage.getItem('rk_sched_v3');  if(s) setScheduleHours(JSON.parse(s));}catch{}
    // Also load from Firebase
    loadFromFirebase();
    setLoaded(true);
  },[]);

  async function loadFromFirebase(){
    const d=await fbLoad('app','state');
    if(d){
      if(d.done)     setDone(d.done);
      if(d.pts)      setPts(d.pts);
      if(d.awarded)  setAwarded(d.awarded);
      if(d.profiles) setProfiles(d.profiles);
    }
  }

  function saveAll(newDone,newPts,newAwarded,newProfiles){
    const state={done:newDone,pts:newPts,awarded:newAwarded,profiles:newProfiles||profiles};
    try{localStorage.setItem('rk_done_v3',JSON.stringify(newDone));}catch{}
    try{localStorage.setItem('rk_pts_v3', JSON.stringify(newPts)); }catch{}
    try{localStorage.setItem('rk_awd_v3', JSON.stringify(newAwarded));}catch{}
    fbSave('app','state',state);
  }

  function allComplete(newDone,pid){
    const tabs=[
      {key:'matin',tkKey:getTaskList('matin')},
      {key:'retour',tkKey:'retour'},
      {key:'dodo',  tkKey:'dodo'},
    ];
    return tabs.every(t=>TASKS[t.tkKey].every(task=>!!newDone[doneKey(pid,t.key,task.id)]));
  }

  function handleResetPts(pid,type){
    if(type==='day'){
      const newDone={...done};
      const t2=todayKey();
      Object.keys(newDone).forEach(k=>{ if(k.startsWith(pid+'_'+t2)) delete newDone[k]; });
      const newAwarded={...awarded};
      delete newAwarded[pid+'_'+t2];
      setDone(newDone); setAwarded(newAwarded);
      saveAll(newDone,pts,newAwarded);
    } else {
      const newPts={...pts};
      delete newPts[pid+'_'+monthKey()];
      setPts(newPts);
      saveAll(done,newPts,awarded);
    }
  }

  function handleSaveCustomTasks(ct){
    setCustomTasks(ct);
    try{localStorage.setItem('rk_ctasks_v3',JSON.stringify(ct));}catch{}
    fbSave('app','state',{done,pts,awarded,profiles,customTasks:ct,scheduleHours});
  }

  function handleSaveSchedule(sh){
    setScheduleHours(sh);
    try{localStorage.setItem('rk_sched_v3',JSON.stringify(sh));}catch{}
    fbSave('app','state',{done,pts,awarded,profiles,customTasks,scheduleHours:sh});
  }

  async function handleToggle(task,tab){
    const key=doneKey(activeId,tab,task.id);
    const newVal=!done[key];
    const newDone={...done,[key]:newVal};
    setDone(newDone);
    if(newVal){
      speak(task.label);
      const aKey=`${activeId}_${todayKey()}`;
      if(allComplete(newDone,activeId)&&!awarded[aKey]){
        const newAwarded={...awarded,[aKey]:true};
        setAwarded(newAwarded);
        const pKey=`${activeId}_${monthKey()}`;
        const newPts={...pts,[pKey]:(pts[pKey]||0)+10};
        setPts(newPts);
        saveAll(newDone,newPts,newAwarded);
        setCelebrate(true);
        setTimeout(()=>speak(`Bravo ${profiles.find(p=>p.id===activeId)?.name} ! Tu as gagné dix points !`),600);
        setTimeout(()=>setCelebrate(false),5000);
        return;
      }
    }
    saveAll(newDone,pts,awarded);
  }

  function handleHeroSave(heroId){
    const newProfiles=profiles.map(p=>p.id===heroFor?{...p,heroId}:p);
    setProfiles(newProfiles);
    try{localStorage.setItem('rk_prof_v3',JSON.stringify(newProfiles));}catch{}
    fbSave('app','state',{done,pts,awarded,profiles:newProfiles});
    setHeroFor(null);
    setScreen('home');
    speak('Super !');
  }

  const profile=profiles.find(p=>p.id===activeId)||profiles[0];

  if(!loaded) return(
    <div style={{display:'flex',height:'100vh',alignItems:'center',justifyContent:'center',fontSize:80,background:'var(--surface)'}}>⏳</div>
  );

  if(heroFor) return <HeroSelectScreen profile={profiles.find(p=>p.id===heroFor)} onSave={handleHeroSave}/>;

  return(
    <div style={{background:'var(--surface)',minHeight:'100vh'}}>
      {celebrate&&<CelebrationOverlay profile={profile} onClose={()=>setCelebrate(false)}/>}

      {screen==='home'&&(
        <HomeScreen
          profiles={profiles}
          activeId={activeId}
          done={done}
          pts={pts}
          onSwitchProfile={id=>setActiveId(id)}
          onTabSelect={tab=>setScreen(tab)}
          onViewBocal={()=>setScreen('bocal')}
          onHeroChange={id=>setHeroFor(id)}
        />
      )}

      {['matin','retour','dodo'].includes(screen)&&(
        <RoutineScreen
          profile={profile}
          tab={screen}
          done={done}
          customTasks={customTasks}
          onToggle={handleToggle}
          onBack={()=>setScreen('home')}
        />
      )}

      {screen==='bocal'&&(
        <BocalScreen profile={profile} pts={pts} onBack={()=>setScreen('home')}/>
      )}

      {screen==='parent'&&(
        <ParentDashboard
          profiles={profiles}
          pts={pts}
          done={done}
          awarded={awarded}
          customTasks={customTasks}
          scheduleHours={scheduleHours}
          onResetPts={handleResetPts}
          onSaveCustomTasks={handleSaveCustomTasks}
          onSaveSchedule={handleSaveSchedule}
          onBack={()=>setScreen('home')}
        />
      )}

      {screen!=='parent'&&(
        <BottomNav screen={screen} onNav={s=>{
          if(s==='parent') setScreen('parent');
          else if(['home','matin','retour','dodo','bocal'].includes(s)) setScreen(s);
        }}/>
      )}
    </div>
  );
}

    const days=[];

      const dayName=['D','L','M','M','J','V','S'][d.getDay()];
      const aKey=`${pid}_${dk}`;
      days.push({label:dayName,done:!!awarded[aKey],date:dk});

    setTasks({...tasks,[key]:[...curr,{id,label:newTask.label,emoji:newTask.emoji,desc:'Super !',custom:true}]});

          ))}
        </div>
        {pwdErr&&<p style={{color:'#ba1a1a',textAlign:'center',marginBottom:12,fontSize:14}}>Code incorrect !</p>}
        <button className="btn-gold" style={{width:'100%',padding:'16px',fontSize:17}} onClick={handleLogin}>
          Accéder 🔓
        </button>
      </div>
    </div>
  );

  return(
    <div style={{minHeight:'100vh',background:'var(--surf-low)',paddingBottom:40}} className="noscroll">
      {/* Header */}
      <div style={{background:'linear-gradient(135deg,var(--primary),var(--pd))',padding:'52px 20px 24px',color:'white'}}>
        <button onClick={onBack} style={{background:'rgba(255,255,255,.2)',border:'none',borderRadius:'50%',width:44,height:44,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:20,color:'white',marginBottom:16}}>←</button>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <h1 style={{fontSize:28,fontWeight:800}}>Espace Parents 🔐</h1>
            <p style={{opacity:.85,marginTop:4}}>Gérez les routines et suivez les progrès</p>
          </div>
          <div style={{background:'rgba(255,255,255,.2)',borderRadius:'var(--radius-md)',padding:'10px 16px',textAlign:'center'}}>
            <div style={{fontSize:11,opacity:.8,marginBottom:4}}>AUJOURD'HUI</div>
            <div style={{fontWeight:800,fontSize:16}}>
              {profiles.map(p=>{ const aKey=`${p.id}_${today}`; return awarded[aKey]?'✅':' '; }).join(' ')}
            </div>
          </div>
        </div>

        {/* Tabs */}
        <div style={{display:'flex',gap:10,marginTop:20}}>
          {[{k:'tasks',l:'📋 Tâches'},{k:'rapports',l:'📊 Rapports'},{k:'horaires',l:'🕐 Horaires'},{k:'reset',l:'🔄 Reset'}].map(t=>(
            <button key={t.k} onClick={()=>setTab(t.k)} style={{
              background:tab===t.k?'white':'rgba(255,255,255,.2)',
              color:tab===t.k?'var(--primary)':'white',
              border:'none',borderRadius:'var(--radius-full)',
              padding:'8px 14px',fontFamily:"'Plus Jakarta Sans',sans-serif",
              fontWeight:700,fontSize:12,cursor:'pointer',
              whiteSpace:'nowrap',
            }}>{t.l}</button>
          ))}
        </div>
      </div>

      <div style={{padding:'20px 20px 0'}}>

        {/* ── TÂCHES ── */}
        {tab==='tasks'&&(
          <div>
            {/* Routine selector */}
            <div style={{display:'flex',gap:8,marginBottom:20,overflowX:'auto',paddingBottom:4}} className="noscroll">
              {tabKeys.map(k=>(
                <button key={k} onClick={()=>setEditTab(k)} style={{
                  background:editTab===k?'var(--primary)':'var(--white)',
                  color:editTab===k?'white':'var(--on-surf)',
                  border:'none',borderRadius:'var(--radius-full)',
                  padding:'10px 16px',fontFamily:"'Plus Jakarta Sans',sans-serif",
                  fontWeight:700,fontSize:12,cursor:'pointer',whiteSpace:'nowrap',
                  boxShadow:'0 2px 8px rgba(0,0,0,.08)',
                }}>{tabLabels[k]}</button>
              ))}
            </div>

            {/* Task list */}
            <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:20}}>
              {(tasks[editTab]||TASKS[editTab]).map(task=>(
                <div key={task.id} className="card" style={{padding:'14px 16px',display:'flex',alignItems:'center',gap:12}}>
                  {/* Emoji button */}
                  <div style={{position:'relative'}}>
                    <button onClick={()=>setEmojiPick(emojiPick===task.id?false:task.id)} style={{
                      width:48,height:48,borderRadius:'1rem',
                      background:'var(--pf)',border:'none',cursor:'pointer',fontSize:26,
                    }}>{task.emoji}</button>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:15}}>{task.label}</div>
                    {task.custom&&<span style={{fontSize:10,background:'var(--sec-cnt)',color:'var(--secondary)',borderRadius:20,padding:'2px 8px'}}>Personnalisé</span>}
                  </div>
                  <button onClick={()=>removeTask(editTab,task.id)} style={{
                    background:'#ffdad6',color:'#ba1a1a',border:'none',
                    borderRadius:'50%',width:36,height:36,cursor:'pointer',
                    display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,
                  }}>✕</button>
                  {/* Emoji picker */}
                  {emojiPick===task.id&&(
                    <div style={{
                      position:'absolute',left:20,right:20,
                      background:'var(--white)',borderRadius:'var(--radius-lg)',
                      padding:16,boxShadow:'0 16px 48px rgba(0,0,0,.2)',
                      zIndex:500,display:'flex',flexWrap:'wrap',gap:8,
                    }}>
                      {EMOJI_PICKER.map(e=>(
                        <button key={e} onClick={()=>{changeEmoji(editTab,task.id,e);setEmojiPick(false);}} style={{
                          fontSize:28,background:'none',border:'none',cursor:'pointer',
                          padding:'4px',borderRadius:8,
                        }}>{e}</button>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* Add task */}
            <div className="card" style={{padding:'16px'}}>
              <h3 style={{fontSize:15,fontWeight:800,marginBottom:12}}>➕ Ajouter une tâche</h3>
              <div style={{display:'flex',gap:10,marginBottom:12}}>
                <button onClick={()=>setEmojiPick('new')} style={{
                  width:52,height:52,borderRadius:'1rem',background:'var(--pf)',
                  border:'none',cursor:'pointer',fontSize:28,flexShrink:0,
                }}>{newTask.emoji}</button>
                {emojiPick==='new'&&(
                  <div style={{
                    position:'absolute',left:20,right:20,
                    background:'var(--white)',borderRadius:'var(--radius-lg)',
                    padding:16,boxShadow:'0 16px 48px rgba(0,0,0,.2)',
                    zIndex:500,display:'flex',flexWrap:'wrap',gap:8,
                  }}>
                    {EMOJI_PICKER.map(e=>(
                      <button key={e} onClick={()=>{setNewTask(t=>({...t,emoji:e}));setEmojiPick(false);}} style={{
                        fontSize:28,background:'none',border:'none',cursor:'pointer',padding:'4px',borderRadius:8,
                      }}>{e}</button>
                    ))}
                  </div>
                )}
                <input value={newTask.label} onChange={e=>setNewTask(t=>({...t,label:e.target.value}))}
                  placeholder="Nom de la tâche..."
                  style={{
                    flex:1,padding:'12px 16px',borderRadius:'var(--radius-md)',
                    border:'2px solid var(--surf-top)',background:'var(--surf-low)',
                    fontFamily:"'Be Vietnam Pro',sans-serif",fontSize:15,outline:'none',
                  }}/>
              </div>
              <button className="btn-gold" style={{width:'100%',padding:'14px',fontSize:15}} onClick={addTask}>
                Ajouter ✨
              </button>
            </div>

            <button className="btn-gold" style={{width:'100%',padding:'16px',fontSize:16,marginTop:20}} onClick={handleSave}>
              {saved?'✅ Sauvegardé !':'💾 Sauvegarder les changements'}
            </button>
          </div>
        )}

        {/* ── RAPPORTS ── */}
        {tab==='rapports'&&(
          <div>
            {profiles.map(p=>{
              const hero=getHero(p.heroId);
              const monthPts=pts[`${p.id}_${month}`]||0;
              const history=getHistory(p.id);
              const streak=history.filter(d=>d.done).length;
              const tabs2=[
                {key:'matin',tkKey:getTaskList('matin')},
                {key:'retour',tkKey:'retour'},
                {key:'dodo',tkKey:'dodo'},
              ];
              const todayDone=tabs2.reduce((acc,t)=>{
                const ts=TASKS[t.tkKey];
                return acc+ts.filter(task=>done[doneKey(p.id,t.key,task.id)]).length;
              },0);
              const todayTotal=tabs2.reduce((acc,t)=>acc+TASKS[t.tkKey].length,0);
              return(
                <div key={p.id} className="card" style={{padding:'20px',marginBottom:16}}>
                  <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:16}}>
                    <span style={{fontSize:48}}>{hero.emoji}</span>
                    <div style={{flex:1}}>
                      <h3 style={{fontSize:20,fontWeight:800}}>{p.name}</h3>
                      <p style={{color:'var(--on-var)',fontSize:13}}>⭐ {monthPts} pts ce mois</p>
                    </div>
                    <div style={{background:'var(--ter-cnt)',borderRadius:'var(--radius-md)',padding:'10px 16px',textAlign:'center'}}>
                      <div style={{fontWeight:800,fontSize:22,color:'#005318'}}>{todayDone}/{todayTotal}</div>
                      <div style={{fontSize:11,color:'#005318'}}>Aujourd'hui</div>
                    </div>
                  </div>

                  {/* Weekly history */}
                  <div style={{marginBottom:14}}>
                    <p style={{fontSize:13,fontWeight:700,marginBottom:10,color:'var(--on-var)'}}>7 derniers jours :</p>
                    <div style={{display:'flex',gap:8}}>
                      {history.map((d,i)=>(
                        <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
                          <div style={{
                            width:'100%',aspectRatio:'1',borderRadius:'0.75rem',
                            background:d.done?'var(--ter-cnt)':'var(--surf-top)',
                            display:'flex',alignItems:'center',justifyContent:'center',
                            fontSize:18,
                          }}>{d.done?'✅':'🔒'}</div>
                          <span style={{fontSize:10,fontWeight:700,color:'var(--on-var)'}}>{d.label}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Streak */}
                  <div style={{
                    background:'linear-gradient(135deg,var(--pf),#fff3c4)',
                    borderRadius:'var(--radius-md)',padding:'12px 16px',
                    display:'flex',alignItems:'center',gap:12,
                  }}>
                    <span style={{fontSize:28}}>🔥</span>
                    <div>
                      <span style={{fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:800,fontSize:18,color:'var(--primary)'}}>{streak} / 7 jours</span>
                      <p style={{fontSize:12,color:'var(--on-var)',marginTop:2}}>complétés cette semaine</p>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ── HORAIRES ── */}
        {tab==='horaires'&&(
          <div>
            <p style={{color:'var(--on-var)',marginBottom:20,fontSize:14}}>Ajustez les plages horaires pour chaque routine (heure de Mountain Time Edmonton)</p>
            {[
              {key:'matin', label:'☀️ Matin', emoji:'☀️'},
              {key:'retour',label:'🏠 Retour',emoji:'🏠'},
              {key:'dodo',  label:'🌙 Dodo',  emoji:'🌙'},
            ].map(r=>(
              <div key={r.key} className="card" style={{padding:'18px',marginBottom:14}}>
                <h3 style={{fontSize:16,fontWeight:800,marginBottom:14}}>{r.label}</h3>
                <div style={{display:'flex',gap:16,alignItems:'center'}}>
                  <div style={{flex:1}}>
                    <label style={{fontSize:12,fontWeight:700,color:'var(--on-var)',display:'block',marginBottom:6}}>Début</label>
                    <select value={hours[r.key]?.[0]||0} onChange={e=>setHours(h=>({...h,[r.key]:[parseInt(e.target.value),h[r.key]?.[1]||23]}))} style={{
                      width:'100%',padding:'10px 12px',borderRadius:'var(--radius-sm)',
                      border:'2px solid var(--surf-top)',background:'var(--surf-low)',
                      fontFamily:"'Be Vietnam Pro',sans-serif",fontSize:15,
                    }}>
                      {Array.from({length:24}).map((_,i)=>(
                        <option key={i} value={i}>{i}h00</option>
                      ))}
                    </select>
                  </div>
                  <span style={{fontSize:22,marginTop:20}}>→</span>
                  <div style={{flex:1}}>
                    <label style={{fontSize:12,fontWeight:700,color:'var(--on-var)',display:'block',marginBottom:6}}>Fin</label>
                    <select value={hours[r.key]?.[1]||23} onChange={e=>setHours(h=>({...h,[r.key]:[h[r.key]?.[0]||0,parseInt(e.target.value)]}))} style={{
                      width:'100%',padding:'10px 12px',borderRadius:'var(--radius-sm)',
                      border:'2px solid var(--surf-top)',background:'var(--surf-low)',
                      fontFamily:"'Be Vietnam Pro',sans-serif",fontSize:15,
                    }}>
                      {Array.from({length:24}).map((_,i)=>(
                        <option key={i} value={i}>{i}h00</option>
                      ))}
                    </select>
                  </div>
                </div>
              </div>
            ))}
            <button className="btn-gold" style={{width:'100%',padding:'16px',fontSize:16,marginTop:8}} onClick={handleSave}>
              {saved?'✅ Sauvegardé !':'💾 Sauvegarder'}
            </button>
          </div>
        )}

        {/* ── RESET ── */}
        {tab==='reset'&&(
          <div>
            <p style={{color:'var(--on-var)',marginBottom:20,fontSize:14}}>Réinitialisez les points ou les tâches du jour pour chaque enfant.</p>
            {profiles.map(p=>{
              const hero=getHero(p.heroId);
              const monthPts=pts[`${p.id}_${month}`]||0;
              return(
                <div key={p.id} className="card" style={{padding:'20px',marginBottom:14}}>
                  <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:16}}>
                    <span style={{fontSize:48}}>{hero.emoji}</span>
                    <div>
                      <h3 style={{fontSize:18,fontWeight:800}}>{p.name}</h3>
                      <p style={{color:'var(--on-var)',fontSize:13}}>⭐ {monthPts} pts ce mois</p>
                    </div>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    <button onClick={()=>onResetPts(p.id,'day')} style={{
                      padding:'14px',borderRadius:'var(--radius-md)',
                      background:'#fff8e1',color:'#F57F17',
                      border:'2px solid #FFE082',cursor:'pointer',
                      fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:14,
                    }}>🔄 Réinitialiser les tâches du jour</button>
                    <button onClick={()=>{if(window.confirm(`Effacer tous les points de ${p.name} ce mois ?`)) onResetPts(p.id,'month');}} style={{
                      padding:'14px',borderRadius:'var(--radius-md)',
                      background:'#ffdad6',color:'#ba1a1a',
                      border:'2px solid #ffb4ab',cursor:'pointer',
                      fontFamily:"'Plus Jakarta Sans',sans-serif",fontWeight:700,fontSize:14,
                    }}>🗑️ Effacer les points du mois</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
