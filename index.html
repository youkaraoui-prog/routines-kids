@keyframes slideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}

.tcard{cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .2s cubic-bezier(.34,1.56,.64,1);}

.btn{font-family:"Fredoka One",cursive;border:none;cursor:pointer;border-radius:var(--r-full);transition:transform .15s,box-shadow .15s;}
.btn:active{transform:scale(.93);}
.btn-orange{background:linear-gradient(135deg,#FF8C42,#FF6B6B);color:#fff;box-shadow:0 6px 20px rgba(255,140,66,.35);}
.btn-teal{background:linear-gradient(135deg,#4ECDC4,#45B7D1);color:#fff;box-shadow:0 6px 20px rgba(78,205,196,.35);}
.btn-outline{background:var(--card);color:var(--text);border:2.5px solid #E0E0E0;}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:0 4px 20px rgba(0,0,0,.07);}
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,248,240,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:10px 8px 28px;display:flex;justify-content:space-around;align-items:center;z-index:200;box-shadow:0 -2px 20px rgba(0,0,0,.06);}
