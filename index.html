  try{shown=JSON.parse(localStorage.getItem(sk)||'[]');}catch{}
  const avail=arr.map((_,i)=>i).filter(i=>!shown.includes(i));
  const pool=avail.length?avail:arr.map((_,i)=>i);
  if(!avail.length){shown=[];}
  const idx=pool[Math.floor(Math.random()*pool.length)];
  shown.push(idx);
  try{localStorage.setItem(sk,JSON.stringify(shown));}catch{}
  return{text:arr[idx],index:shown.length,total:arr.length};
}

/* ── UTILS ── */
function todayKey(){return new Date().toISOString().split('T')[0];}
function monthKey(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()}`;}
function isWeekend(){const d=new Date().getDay();return d===0||d===6;}
function getDayName(){return ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][new Date().getDay()];}
function getActiveTab(){const h=new Date().getHours();if(h>=6&&h<12)return 'matin';if(h>=12&&h<19)return 'retour';return 'dodo';}
function getHero(id){return HEROES.find(h=>h.id===id)||HEROES[0];}
function getAvatar(profile){
  if(profile&&profile.photoUrl)return{type:'photo',value:profile.photoUrl};
  const h=getHero(profile?.heroId);return{type:'emoji',value:h.emoji};
}
function AvatarDisplay({profile,size=54,cls=''}){
  const av=getAvatar(profile);
  if(av.type==='photo')return(
    <img src={av.value} alt="profil" style={{width:size,height:size,borderRadius:'50%',objectFit:'cover',border:'3px solid white',boxShadow:'0 4px 12px rgba(0,0,0,.15)',display:'inline-block'}}/>
  );
  return <span className={cls} style={{fontSize:size*.82,lineHeight:1,display:'inline-block'}}>{av.value}</span>;
}
function doneKey(pid,tab,tid){return `${pid}_${todayKey()}_${tab}_${tid}`;}
function getTaskList(tab,cts){
  const key=tab==='matin'?(isWeekend()?'matin_weekend':'matin_semaine'):tab;
  return (cts&&cts[key])||DEFAULT_TASKS[key]||[];
}

function Confetti(){
  const cols=['#FF6B6B','#FFE66D','#4ECDC4','#45B7D1','#96CEB4','#FF8B94','#A8E6CF','#FFD700','#C77DFF','#FF8C42'];

function StarBar({pts,total}){
  const pct=Math.min((pts/total)*100,100);
  return(
    <div>

}

// HERO SELECT
function HeroSelectScreen({profile,onSave}){
  const [sel,setSel]=useState(profile.heroId);

  const fileRef=useRef();
  function handlePhoto(e){
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{setPhotoUrl(ev.target.result);setSel('__photo__');};
    reader.readAsDataURL(file);
  }
  function handleSave(){
    if(sel==='__photo__'&&photoUrl)onSave('__photo__',photoUrl);
    else onSave(sel,null);
  }
  return(
    <div style={{minHeight:'100vh',background:'var(--bg)',padding:'52px 20px 40px'}}>

        padding:'16px',marginBottom:14,display:'flex',alignItems:'center',gap:16,
        border:sel==='__photo__'?'3px solid var(--blue)':'3px solid transparent',
        background:sel==='__photo__'?'#EBF4FF':'var(--card)',
        boxShadow:sel==='__photo__'?'0 8px 28px rgba(77,150,255,.25)':'0 4px 16px rgba(0,0,0,.07)',
      }}>
        {photoUrl&&sel==='__photo__'
          ?<img src={photoUrl} alt="photo" style={{width:68,height:68,borderRadius:'50%',objectFit:'cover',border:'3px solid var(--blue)',flexShrink:0}}/>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:28}}>
        {HEROES.map(h=>{
          const active=sel===h.id;
          return(

              padding:'18px 10px',display:'flex',flexDirection:'column',alignItems:'center',gap:8,

// GAME SCREEN
function GameScreen({catKey,gameId,profile,gameScores,onBack,onComplete}){
  const cat=GAMES_DATA[catKey];
  const game=cat.games.find(g=>g.id===gameId);
  const [qIdx,setQIdx]=useState(0);
  const [score,setScore]=useState(0);
  const [selected,setSelected]=useState(null);
  const [answered,setAnswered]=useState(false);
  const [finished,setFinished]=useState(false);
  const [streak,setStreak]=useState(0);
  const [fact,setFact]=useState(null);
  const [showFact,setShowFact]=useState(false);

  const q=game.questions[qIdx];

  function handleAnswer(choice){
    if(answered)return;
    setSelected(choice);setAnswered(true);
    const correct=choice===q.answer;
    if(correct){setScore(s=>s+1);setStreak(s=>s+1);speak('Bravo !');}
    else{setStreak(0);speak('Presque ! C\'est '+q.answer);}
    const f=getNextFact(profile?.id||'guest',q.answer);
    setTimeout(()=>{
      if(f){setFact(f);setShowFact(true);}
      else if(qIdx<game.questions.length-1){setQIdx(i=>i+1);setSelected(null);setAnswered(false);}
      else setFinished(true);
    },1000);
  }
  function handleFactClose(){
    setShowFact(false);setFact(null);
    if(qIdx<game.questions.length-1){setQIdx(i=>i+1);setSelected(null);setAnswered(false);}
    else setFinished(true);
  }

  if(showFact&&fact) return(
    <div style={{minHeight:'100vh',background:cat.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:28}}>
      <div className="spring-in card" style={{padding:'32px 24px',maxWidth:360,width:'100%',textAlign:'center'}}>
        <div style={{fontSize:56,marginBottom:14}}>💡</div>
        <div style={{
          background:'linear-gradient(135deg,var(--yellow),var(--orange))',
          color:'white',borderRadius:'var(--r-full)',padding:'6px 18px',
          fontSize:12,fontWeight:800,display:'inline-block',marginBottom:18,
          fontFamily:"'Fredoka One',cursive",letterSpacing:.5,
        }}>LE SAVAIS-TU ? {fact.index}/{fact.total}</div>
        <p style={{fontSize:19,fontWeight:700,lineHeight:1.6,color:'var(--text)',marginBottom:28}}>
          {fact.text}
        </p>
        <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:24}}>
          {Array.from({length:fact.total}).map((_,i)=>(
            <div key={i} style={{width:10,height:10,borderRadius:'50%',background:i<fact.index?cat.color:'#E0E0E0'}}/>
          ))}
        </div>
        <button className="btn btn-orange" style={{width:'100%',padding:'16px',fontSize:18}} onClick={handleFactClose}>
          Continuer ! ➡️
        </button>
      </div>
    </div>
  );

  if(finished) return(
    <div style={{minHeight:'100vh',background:cat.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,gap:20}}>
      <Confetti/>
      <span className="bounce" style={{fontSize:90}}>🎉</span>
      <div className="card spring-in" style={{padding:'32px 40px',textAlign:'center',maxWidth:340}}>
        <div style={{fontSize:64}}>{profile?getHero(profile.heroId).emoji:'⭐'}</div>
        <h2 className="title-font" style={{fontSize:30,color:cat.color,marginTop:10}}>Bravo !</h2>
        <p style={{color:'var(--text2)',marginTop:8}}>{game.title}</p>
        <div style={{background:cat.bg,borderRadius:'var(--r-full)',padding:'12px 24px',marginTop:16,display:'inline-block'}}>
          <span className="title-font" style={{fontSize:24,color:cat.color}}>{score}/{game.questions.length} ⭐</span>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:24}}>
          <button className="btn btn-orange" style={{padding:'14px',fontSize:17}} onClick={()=>{setQIdx(0);setScore(0);setSelected(null);setAnswered(false);setFinished(false);setStreak(0);}}>
            Rejouer 🔄
          </button>
          <button className="btn btn-outline" style={{padding:'14px',fontSize:17}} onClick={()=>{onComplete(score,game.questions.length);onBack();}}>
            Retour aux jeux
          </button>
        </div>
      </div>
    </div>
  );

  return(
    <div style={{minHeight:'100vh',background:cat.bg,padding:'52px 20px 110px'}} className="noscroll">
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:24}}>
        <button onClick={onBack} style={{background:'var(--card)',border:'none',borderRadius:'50%',width:44,height:44,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:20,boxShadow:'0 4px 12px rgba(0,0,0,.1)',flexShrink:0}}>←</button>
        <div style={{flex:1}}>
          <h1 className="title-font" style={{fontSize:20,color:cat.color}}>{game.emoji} {game.title}</h1>
          <div style={{display:'flex',gap:4,marginTop:6}}>
            {game.questions.map((_,i)=>(
              <div key={i} style={{flex:1,height:6,borderRadius:20,background:i<qIdx?cat.color:i===qIdx?cat.color+'88':'#E0E0E0',transition:'background .3s'}}/>
            ))}
          </div>
        </div>
        <div style={{background:'var(--card)',borderRadius:20,padding:'6px 14px',flexShrink:0}}>
          <span className="title-font" style={{color:cat.color,fontSize:16}}>⭐ {score}</span>
        </div>
      </div>

      {/* Question card */}
      <div className="card" style={{padding:'28px 20px',marginBottom:20,textAlign:'center'}}>
        <div className="bounce" style={{fontSize:72,marginBottom:16}}>{q.display}</div>
        <p style={{fontWeight:800,fontSize:17,color:'var(--text)',lineHeight:1.4}}>{q.prompt}</p>
        <button onClick={()=>speak(q.prompt)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--blue)',fontSize:16,marginTop:8}}>🔊</button>
      </div>

      {/* Choices */}
      <div style={{display:'grid',gridTemplateColumns:q.choices.length<=2?'1fr 1fr':'1fr 1fr',gap:14}}>
        {q.choices.map(choice=>{
          let bg='var(--card)',border='2.5px solid #E0E0E0',color='var(--text)';
          if(answered){
            if(choice===q.answer){bg='#E8F5E9';border='2.5px solid var(--green)';color='#1B5E20';}
            else if(choice===selected&&choice!==q.answer){bg='#FFEBEE';border='2.5px solid var(--red)';color='#B71C1C';}
          }
          return(
            <div key={choice} onClick={()=>handleAnswer(choice)} className="tcard" style={{
              padding:'16px 10px',borderRadius:'var(--r-lg)',background:bg,border,
              textAlign:'center',boxShadow:'0 4px 14px rgba(0,0,0,.08)',
              display:'flex',flexDirection:'column',alignItems:'center',gap:8,
            }}>
              <span style={{fontSize:44,lineHeight:1}}>
                {answered&&choice===q.answer?'✅':answered&&choice===selected&&choice!==q.answer?'❌':(CHOICE_ICONS[choice]||'❓')}
              </span>
              <span className="title-font" style={{fontSize:14,color,lineHeight:1.2,textAlign:'center'}}>
                {choice}
              </span>
            </div>
          );
        })}
      </div>

      {streak>=2&&(
        <div className="slide-up" style={{marginTop:20,background:'linear-gradient(135deg,var(--orange),var(--yellow))',borderRadius:'var(--r-lg)',padding:'14px 20px',display:'flex',alignItems:'center',gap:12,color:'white'}}>
          <span style={{fontSize:28}}>🔥</span>
          <span className="title-font" style={{fontSize:16}}>Série de {streak} bonnes réponses !</span>
        </div>
      )}
    </div>
  );
}

// PARENT DASHBOARD
function ParentDashboard({profiles,pts,done,awarded,customTasks,scheduleHours,onResetPts,onSaveCustomTasks,onSaveSchedule,onBack}){
  const [authed,setAuthed]=useState(false);
  const [pwd,setPwd]=useState('');
  const [pwdErr,setPwdErr]=useState(false);
  const [tab,setTab]=useState('tasks');
  const [editTab,setEditTab]=useState('matin_semaine');
  const [tasks,setTasks]=useState(()=>JSON.parse(JSON.stringify(customTasks||{})));
  const [hours,setHours]=useState(()=>({matin:[6,12],retour:[12,19],dodo:[19,23],...(scheduleHours||{})}));
  const [newTask,setNewTask]=useState({label:'',emoji:'🌟'});
  const [emojiPick,setEmojiPick]=useState(false);
  const [saved,setSaved]=useState(false);
  const [dragIdx,setDragIdx]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const month=monthKey();
  const today=todayKey();

  function getHistory(pid){
    return Array.from({length:7}).map((_,i)=>{
      const d=new Date();d.setDate(d.getDate()-(6-i));
      const dk=d.toISOString().split('T')[0];
      const dayName=['D','L','M','M','J','V','S'][d.getDay()];
      return{label:dayName,done:!!awarded[`${pid}_${dk}`],date:dk};
    });
  }

  function handleLogin(){
    if(pwd==='1234'){setAuthed(true);setPwdErr(false);}
    else{setPwdErr(true);setPwd('');}
  }

  function currentTasks(){return tasks[editTab]||[...DEFAULT_TASKS[editTab]];}

  function addTask(){
    if(!newTask.label.trim())return;
    const id='c_'+Date.now();
    setTasks(t=>({...t,[editTab]:[...currentTasks(),{id,label:newTask.label,emoji:newTask.emoji,desc:'Super !',custom:true}]}));
    setNewTask({label:'',emoji:'🌟'});
  }

  function removeTask(id){setTasks(t=>({...t,[editTab]:currentTasks().filter(tk=>tk.id!==id)}));}
  function changeEmoji(id,emoji){setTasks(t=>({...t,[editTab]:currentTasks().map(tk=>tk.id===id?{...tk,emoji}:tk)}));}

  // Drag reorder (touch + mouse)
  function moveTask(from,to){
    const arr=[...currentTasks()];
    const [item]=arr.splice(from,1);arr.splice(to,0,item);
    setTasks(t=>({...t,[editTab]:arr}));
  }

  function handleDragStart(e,idx){setDragIdx(idx);if(e.dataTransfer)e.dataTransfer.effectAllowed='move';}
  function handleDragOver(e,idx){e.preventDefault();setDragOver(idx);}
  function handleDrop(e,idx){e.preventDefault();if(dragIdx!==null&&dragIdx!==idx)moveTask(dragIdx,idx);setDragIdx(null);setDragOver(null);}
  function handleDragEnd(){setDragIdx(null);setDragOver(null);}

  function handleSave(){onSaveCustomTasks(tasks);onSaveSchedule(hours);setSaved(true);setTimeout(()=>setSaved(false),2000);}

  const tabKeys=['matin_semaine','matin_weekend','retour','dodo'];
  const tabLabels={'matin_semaine':'☀️ Semaine','matin_weekend':'🎉 WE','retour':'🏠 Retour','dodo':'🌙 Dodo'};

  if(!authed) return(
    <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32}}>
      <button onClick={onBack} style={{position:'absolute',top:52,left:20,background:'var(--card)',border:'none',borderRadius:'50%',width:44,height:44,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:20,boxShadow:'0 4px 12px rgba(0,0,0,.1)'}}>←</button>
      <div style={{fontSize:64,marginBottom:12}}>🔐</div>
      <h1 className="title-font" style={{fontSize:26,marginBottom:6}}>Espace Parents</h1>
      <p style={{color:'var(--text2)',marginBottom:28,textAlign:'center',fontSize:14}}>Entrez votre code secret</p>
      <div className="card" style={{padding:28,width:'100%',maxWidth:320}}>
        <div style={{display:'flex',gap:14,justifyContent:'center',marginBottom:24}}>
          {[0,1,2,3].map(i=>(
            <div key={i} style={{width:20,height:20,borderRadius:'50%',background:pwd.length>i?'var(--orange)':'#E0E0E0',transition:'background .2s'}}/>
          ))}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:14}}>
          {[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map((n,i)=>(
            <button key={i} onClick={()=>{
              if(n==='⌫')setPwd(p=>p.slice(0,-1));
              else if(n!==''&&pwd.length<4)setPwd(p=>p+n);
            }} style={{padding:'16px 0',borderRadius:'var(--r-md)',background:n===''?'transparent':'var(--card)',border:'none',cursor:n===''?'default':'pointer',fontFamily:"'Fredoka One',cursive",fontWeight:700,fontSize:22,boxShadow:n===''?'none':'0 2px 8px rgba(0,0,0,.08)',transition:'transform .15s'}}>
              {n}
            </button>
          ))}
        </div>
        {pwdErr&&<p style={{color:'var(--red)',textAlign:'center',marginBottom:10,fontSize:14}}>Code incorrect !</p>}
        <button className="btn btn-orange" style={{width:'100%',padding:'15px',fontSize:17}} onClick={handleLogin}>Entrer 🔓</button>
      </div>
    </div>
  );

  return(
    <div style={{minHeight:'100vh',background:'var(--bg)',paddingBottom:40}} className="noscroll">
      <div style={{background:'linear-gradient(135deg,var(--orange),#FF6B6B)',padding:'52px 20px 22px',color:'white'}}>
        <button onClick={onBack} style={{background:'rgba(255,255,255,.25)',border:'none',borderRadius:'50%',width:44,height:44,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:20,color:'white',marginBottom:14}}>←</button>
        <h1 className="title-font" style={{fontSize:26}}>Espace Parents 🔐</h1>
        <p style={{opacity:.85,marginTop:4,fontSize:14}}>Gérez les routines et les progrès</p>
        <div style={{display:'flex',gap:8,marginTop:18,overflowX:'auto',paddingBottom:2}} className="noscroll">
          {[{k:'tasks',l:'📋 Tâches'},{k:'rapports',l:'📊 Rapports'},{k:'horaires',l:'🕐 Horaires'},{k:'reset',l:'🔄 Reset'}].map(t=>(
            <button key={t.k} onClick={()=>setTab(t.k)} style={{background:tab===t.k?'white':'rgba(255,255,255,.25)',color:tab===t.k?'var(--orange)':'white',border:'none',borderRadius:'var(--r-full)',padding:'8px 16px',fontFamily:"'Fredoka One',cursive",fontSize:13,cursor:'pointer',whiteSpace:'nowrap',transition:'all .2s'}}>
              {t.l}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:'20px'}}>
        {/* TÂCHES */}
        {tab==='tasks'&&(
          <div>
            <div style={{display:'flex',gap:8,marginBottom:18,overflowX:'auto',paddingBottom:2}} className="noscroll">
              {tabKeys.map(k=>(
                <button key={k} onClick={()=>setEditTab(k)} style={{background:editTab===k?'var(--orange)':'var(--card)',color:editTab===k?'white':'var(--text)',border:'none',borderRadius:'var(--r-full)',padding:'9px 16px',fontFamily:"'Fredoka One',cursive",fontSize:12,cursor:'pointer',whiteSpace:'nowrap',boxShadow:'0 2px 8px rgba(0,0,0,.08)'}}>
                  {tabLabels[k]}
                </button>
              ))}
            </div>
            <p style={{fontSize:12,color:'var(--text2)',marginBottom:12}}>💡 Maintenez et glissez pour réordonner</p>
            <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:20}}>
              {currentTasks().map((task,idx)=>(
                <div key={task.id}
                  draggable
                  onDragStart={e=>handleDragStart(e,idx)}
                  onDragOver={e=>handleDragOver(e,idx)}
                  onDrop={e=>handleDrop(e,idx)}
                  onDragEnd={handleDragEnd}
                  className="card drag-item"
                  style={{padding:'12px 14px',display:'flex',alignItems:'center',gap:12,opacity:dragIdx===idx?.5:1,borderTop:dragOver===idx?'3px solid var(--orange)':'3px solid transparent'}}>
                  <span style={{fontSize:20,color:'#CCC',cursor:'grab'}}>⠿</span>
                  <button onClick={()=>setEmojiPick(emojiPick===task.id?false:task.id)} style={{width:44,height:44,borderRadius:'1rem',background:'#FFF3E6',border:'none',cursor:'pointer',fontSize:24,flexShrink:0}}>
                    {task.emoji}
                  </button>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:800,fontSize:14}}>{task.label}</div>
                    {task.custom&&<span style={{fontSize:10,background:'#E3F9F9',color:'var(--teal)',borderRadius:20,padding:'2px 8px'}}>Custom</span>}
                  </div>
                  <button onClick={()=>removeTask(task.id)} style={{background:'#FFEBEE',color:'var(--red)',border:'none',borderRadius:'50%',width:34,height:34,cursor:'pointer',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
                </div>
              ))}
            </div>
            {emojiPick&&emojiPick!=='new'&&(
              <div style={{position:'fixed',inset:0,zIndex:800,background:'rgba(0,0,0,.5)',display:'flex',alignItems:'flex-end'}} onClick={()=>setEmojiPick(false)}>
                <div onClick={e=>e.stopPropagation()} style={{background:'var(--card)',borderRadius:'var(--r-xl) var(--r-xl) 0 0',padding:'24px 20px',width:'100%',display:'flex',flexWrap:'wrap',gap:12}}>
                  <h3 className="title-font" style={{width:'100%',marginBottom:8}}>Choisis un emoji</h3>
                  {EMOJIS.map(e=>(
                    <button key={e} onClick={()=>{changeEmoji(emojiPick,e);setEmojiPick(false);}} style={{fontSize:30,background:'var(--bg)',border:'none',cursor:'pointer',padding:'8px',borderRadius:'var(--r-md)'}}>
                      {e}

                  ))}

            )}
            <div className="card" style={{padding:'16px',marginBottom:16}}>
              <h3 className="title-font" style={{fontSize:15,marginBottom:12}}>➕ Ajouter une tâche</h3>
              <div style={{display:'flex',gap:10,marginBottom:12}}>
                <button onClick={()=>setEmojiPick('new')} style={{width:50,height:50,borderRadius:'1rem',background:'#FFF3E6',border:'none',cursor:'pointer',fontSize:26,flexShrink:0}}>

                </button>
                {emojiPick==='new'&&(
                  <div style={{position:'fixed',inset:0,zIndex:800,background:'rgba(0,0,0,.5)',display:'flex',alignItems:'flex-end'}} onClick={()=>setEmojiPick(false)}>
                    <div onClick={e=>e.stopPropagation()} style={{background:'var(--card)',borderRadius:'var(--r-xl) var(--r-xl) 0 0',padding:'24px 20px',width:'100%',display:'flex',flexWrap:'wrap',gap:12}}>
                      {EMOJIS.map(e=>(
                        <button key={e} onClick={()=>{setNewTask(t=>({...t,emoji:e}));setEmojiPick(false);}} style={{fontSize:30,background:'var(--bg)',border:'none',cursor:'pointer',padding:'8px',borderRadius:'var(--r-md)'}}>
                          {e}
                        </button>
                      ))}
                    </div>
                  </div>
                )}
                <input value={newTask.label} onChange={e=>setNewTask(t=>({...t,label:e.target.value}))} placeholder="Nom de la tâche..." style={{flex:1,padding:'12px 14px',borderRadius:'var(--r-md)',border:'2px solid #E0E0E0',background:'var(--bg)',fontFamily:"'Nunito',sans-serif",fontSize:14,outline:'none'}}/>
              </div>
              <button className="btn btn-teal" style={{width:'100%',padding:'14px',fontSize:16}} onClick={addTask}>Ajouter ✨</button>
            </div>
            <button className="btn btn-orange" style={{width:'100%',padding:'16px',fontSize:17}} onClick={handleSave}>
              {saved?'✅ Sauvegardé !':'💾 Sauvegarder'}
            </button>
          </div>
        )}

        {/* RAPPORTS */}
        {tab==='rapports'&&(
          <div>
            {profiles.map(p=>{
              const hero=getHero(p.heroId);
              const monthPts=pts[`${p.id}_${month}`]||0;
              const history=getHistory(p.id);
              const streak=history.filter(d=>d.done).length;
              const tabs2=[{key:'matin',tkKey:isWeekend()?'matin_weekend':'matin_semaine'},{key:'retour',tkKey:'retour'},{key:'dodo',tkKey:'dodo'}];
              const todayD=tabs2.reduce((a,t)=>a+(getTaskList(t.key,customTasks)||[]).filter(task=>done[doneKey(p.id,t.key,task.id)]).length,0);
              const todayT=tabs2.reduce((a,t)=>a+(getTaskList(t.key,customTasks)||[]).length,0);
              return(
                <div key={p.id} className="card" style={{padding:'20px',marginBottom:16}}>
                  <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:16}}>
                    <AvatarDisplay profile={p} size={48}/>
                    <div style={{flex:1}}>
                      <h3 className="title-font" style={{fontSize:20}}>{p.name}</h3>
                      <p style={{color:'var(--text2)',fontSize:13}}>⭐ {monthPts} pts ce mois</p>
                    </div>
                    <div style={{background:'#E8F5E9',borderRadius:'var(--r-md)',padding:'10px 14px',textAlign:'center'}}>
                      <div className="title-font" style={{fontSize:22,color:'var(--green)'}}>{todayD}/{todayT}</div>
                      <div style={{fontSize:10,color:'var(--green)'}}>Aujourd'hui</div>
                    </div>
                  </div>
                  <div style={{marginBottom:12}}>
                    <p style={{fontSize:12,fontWeight:700,color:'var(--text2)',marginBottom:8}}>7 derniers jours :</p>
                    <div style={{display:'flex',gap:6}}>
                      {history.map((d,i)=>(
                        <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                          <div style={{width:'100%',aspectRatio:'1',borderRadius:'0.75rem',background:d.done?'#E8F5E9':'#F5F5F5',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>
                            {d.done?'✅':'🔒'}
                          </div>
                          <span style={{fontSize:10,fontWeight:700,color:'var(--text2)'}}>{d.label}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div style={{background:'#FFF3E6',borderRadius:'var(--r-md)',padding:'12px 16px',display:'flex',alignItems:'center',gap:12}}>
                    <span style={{fontSize:28}}>🔥</span>
                    <div>
                      <span className="title-font" style={{fontSize:18,color:'var(--orange)'}}>{streak} / 7 jours</span>
                      <p style={{fontSize:12,color:'var(--text2)',marginTop:2}}>complétés cette semaine</p>
                    </div>
                  </div>
                  <div style={{marginTop:12}}>
                    <StarBar pts={monthPts} total={TARGET}/>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* HORAIRES */}
        {tab==='horaires'&&(
          <div>
            <p style={{color:'var(--text2)',marginBottom:20,fontSize:14}}>Ajustez les plages horaires pour chaque routine (heure de Mountain Time Edmonton)</p>
            {[{key:'matin',label:'☀️ Matin'},{key:'retour',label:'🏠 Retour'},{key:'dodo',label:'🌙 Dodo'}].map(r=>(
              <div key={r.key} className="card" style={{padding:'18px',marginBottom:14}}>
                <h3 className="title-font" style={{fontSize:16,marginBottom:14}}>{r.label}</h3>
                <div style={{display:'flex',gap:14,alignItems:'center'}}>
                  <div style={{flex:1}}>
                    <label style={{fontSize:12,fontWeight:700,color:'var(--text2)',display:'block',marginBottom:6}}>Début</label>
                    <select value={hours[r.key]?.[0]||0} onChange={e=>setHours(h=>({...h,[r.key]:[parseInt(e.target.value),h[r.key]?.[1]||23]}))} style={{width:'100%',padding:'10px 12px',borderRadius:'var(--r-sm)',border:'2px solid #E0E0E0',background:'var(--bg)',fontFamily:"'Nunito',sans-serif",fontSize:15}}>
                      {Array.from({length:24}).map((_,i)=><option key={i} value={i}>{i}h00</option>)}
                    </select>
                  </div>
                  <span style={{fontSize:20,marginTop:18}}>→</span>
                  <div style={{flex:1}}>
                    <label style={{fontSize:12,fontWeight:700,color:'var(--text2)',display:'block',marginBottom:6}}>Fin</label>
                    <select value={hours[r.key]?.[1]||23} onChange={e=>setHours(h=>({...h,[r.key]:[h[r.key]?.[0]||0,parseInt(e.target.value)]}))} style={{width:'100%',padding:'10px 12px',borderRadius:'var(--r-sm)',border:'2px solid #E0E0E0',background:'var(--bg)',fontFamily:"'Nunito',sans-serif",fontSize:15}}>
                      {Array.from({length:24}).map((_,i)=><option key={i} value={i}>{i}h00</option>)}
                    </select>
                  </div>
                </div>
              </div>
            ))}
            <button className="btn btn-orange" style={{width:'100%',padding:'16px',fontSize:17}} onClick={handleSave}>
              {saved?'✅ Sauvegardé !':'💾 Sauvegarder'}
            </button>
          </div>
        )}

        {/* RESET */}
        {tab==='reset'&&(
          <div>
            {profiles.map(p=>{
              const hero=getHero(p.heroId);
              return(
                <div key={p.id} className="card" style={{padding:'20px',marginBottom:14}}>
                  <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:16}}>
                    <AvatarDisplay profile={p} size={48}/>
                    <div>
                      <h3 className="title-font" style={{fontSize:18}}>{p.name}</h3>
                      <p style={{color:'var(--text2)',fontSize:13}}>⭐ {pts[`${p.id}_${month}`]||0} pts ce mois</p>
                    </div>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    <button onClick={()=>onResetPts(p.id,'day')} style={{padding:'14px',borderRadius:'var(--r-md)',background:'#FFF8E1',color:'#F57F17',border:'2px solid #FFE082',cursor:'pointer',fontFamily:"'Fredoka One',cursive",fontSize:15}}>
                      🔄 Réinitialiser les tâches du jour
                    </button>
                    <button onClick={()=>{if(window.confirm(`Effacer tous les points de ${p.name} ce mois ?`))onResetPts(p.id,'month');}} style={{padding:'14px',borderRadius:'var(--r-md)',background:'#FFEBEE',color:'var(--red)',border:'2px solid #FFCDD2',cursor:'pointer',fontFamily:"'Fredoka One',cursive",fontSize:15}}>
                      🗑️ Effacer les points du mois
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── APP ROOT ── */
function App(){
  const [screen,setScreen]=useState('home');
  const [gameCtx,setGameCtx]=useState(null);
  const [activeId,setActiveId]=useState('noe');
  const [profiles,setProfiles]=useState(PROFILES_DEF);
  const [done,setDone]=useState({});
  const [pts,setPts]=useState({});
  const [awarded,setAwarded]=useState({});
  const [celebrate,setCelebrate]=useState(false);
  const [heroFor,setHeroFor]=useState(null);
  const [customTasks,setCustomTasks]=useState({});
  const [gameScores,setGameScores]=useState({});
  const [scheduleHours,setScheduleHours]=useState({matin:[6,12],retour:[12,19],dodo:[19,23]});
  const [loaded,setLoaded]=useState(false);

  useEffect(()=>{
    const load=k=>{ try{const s=localStorage.getItem(k);return s?JSON.parse(s):null;}catch{return null;} };
    const d=load('rk_done_v3');if(d)setDone(d);
    const p=load('rk_pts_v3');if(p)setPts(p);
    const a=load('rk_awd_v3');if(a)setAwarded(a);
    const pr=load('rk_prof_v3');if(pr)setProfiles(pr);
    const ct=load('rk_ctasks_v3');if(ct)setCustomTasks(ct);
    const sh=load('rk_sched_v3');if(sh)setScheduleHours(sh);
    const gs=load('rk_gscores_v3');if(gs)setGameScores(gs);
    fbLoad('app','state').then(s=>{
      if(s){
        if(s.done)setDone(s.done);
        if(s.pts)setPts(s.pts);
        if(s.awarded)setAwarded(s.awarded);
        if(s.profiles)setProfiles(s.profiles);
        if(s.customTasks)setCustomTasks(s.customTasks);
        if(s.scheduleHours)setScheduleHours(s.scheduleHours);
      }
    });
    setLoaded(true);
  },[]);

  function save(d,p,a,pr,ct,sh){
    const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};
    save('rk_done_v3',d);save('rk_pts_v3',p);save('rk_awd_v3',a);save('rk_prof_v3',pr||profiles);
    fbSave('app','state',{done:d,pts:p,awarded:a,profiles:pr||profiles,customTasks:ct||customTasks,scheduleHours:sh||scheduleHours});
  }

  function allComplete(nd,pid){
    const tabs=[{key:'matin',tkKey:isWeekend()?'matin_weekend':'matin_semaine'},{key:'retour',tkKey:'retour'},{key:'dodo',tkKey:'dodo'}];
    return tabs.every(t=>(getTaskList(t.key,customTasks)||[]).every(task=>!!nd[doneKey(pid,t.key,task.id)]));
  }

  async function handleToggle(task,tab){
    const key=doneKey(activeId,tab,task.id);
    const newVal=!done[key];
    const newDone={...done,[key]:newVal};setDone(newDone);
    if(newVal){
      speak(task.label);
      const aKey=`${activeId}_${todayKey()}`;
      if(allComplete(newDone,activeId)&&!awarded[aKey]){
        const na={...awarded,[aKey]:true};setAwarded(na);
        const pKey=`${activeId}_${monthKey()}`;
        const np={...pts,[pKey]:(pts[pKey]||0)+10};setPts(np);
        save(newDone,np,na);
        setCelebrate(true);
        setTimeout(()=>speak(`Bravo ${profiles.find(p=>p.id===activeId)?.name} ! Tu as gagné dix points !`),600);
        setTimeout(()=>setCelebrate(false),5000);return;
      }
    }
    save(newDone,pts,awarded);
  }

  function handleGameComplete(catKey,gameId,score,total){
    const key=`${activeId}_${catKey}_${gameId}`;
    const prev=gameScores[key]||{best:0,plays:0,total};
    const ng={...gameScores,[key]:{best:Math.max(prev.best,score),plays:prev.plays+1,total,lastScore:score}};
    setGameScores(ng);
    try{localStorage.setItem('rk_gscores_v3',JSON.stringify(ng));}catch{}
    fbSave('app','state',{done,pts,awarded,profiles,customTasks,scheduleHours,gameScores:ng});
  }

  function handleHeroSave(heroId,photoUrl){
    const np=profiles.map(p=>{
      if(p.id!==heroFor)return p;
      if(heroId==='__photo__')return{...p,photoUrl};
      return{...p,heroId,photoUrl:null};
    });
    setProfiles(np);
    try{localStorage.setItem('rk_prof_v3',JSON.stringify(np));}catch{}
    const npClean=np.map(({photoUrl:_,...rest})=>rest);
    fbSave('app','state',{done,pts,awarded,profiles:npClean,customTasks,scheduleHours});
    setHeroFor(null);setScreen('home');speak('Super !');
  }

  function handleResetPts(pid,type){
    if(type==='day'){
      const nd={...done};const t2=todayKey();const na={...awarded};
      Object.keys(nd).forEach(k=>{if(k.startsWith(pid+'_'+t2))delete nd[k];});
      delete na[pid+'_'+t2];setDone(nd);setAwarded(na);save(nd,pts,na);
    } else {
      const np={...pts};delete np[pid+'_'+monthKey()];setPts(np);save(done,np,awarded);
    }
  }

  function handleSaveCustomTasks(ct){setCustomTasks(ct);try{localStorage.setItem('rk_ctasks_v3',JSON.stringify(ct));}catch{}fbSave('app','state',{done,pts,awarded,profiles,customTasks:ct,scheduleHours});}
  function handleSaveSchedule(sh){setScheduleHours(sh);try{localStorage.setItem('rk_sched_v3',JSON.stringify(sh));}catch{}fbSave('app','state',{done,pts,awarded,profiles,customTasks,scheduleHours:sh});}

  const profile=profiles.find(p=>p.id===activeId)||profiles[0];

  if(!loaded)return(<div style={{display:'flex',height:'100vh',alignItems:'center',justifyContent:'center',fontSize:80,background:'var(--bg)'}}>⏳</div>);
  if(heroFor)return <HeroSelectScreen profile={profiles.find(p=>p.id===heroFor)} onSave={handleHeroSave}/>;

  function handleNav(s){
    if(s==='learn'){setScreen('learn');return;}
    if(['home','matin','retour','dodo','bocal','parent'].includes(s))setScreen(s);
  }

  return(
    <div style={{background:'var(--bg)',minHeight:'100vh'}}>
      {celebrate&&<CelebrationOverlay profile={profile} onClose={()=>setCelebrate(false)}/>}

      {screen==='home'&&<HomeScreen profiles={profiles} activeId={activeId} done={done} pts={pts} customTasks={customTasks} onSwitch={setActiveId} onTab={setScreen} onBocal={()=>setScreen('bocal')} onHeroChange={id=>setHeroFor(id)} onLearn={()=>setScreen('learn')}/>}

      {['matin','retour','dodo'].includes(screen)&&<RoutineScreen profile={profile} tab={screen} done={done} customTasks={customTasks} onToggle={handleToggle} onBack={()=>setScreen('home')}/>}

      {screen==='bocal'&&<BocalScreen profile={profile} pts={pts} onBack={()=>setScreen('home')}/>}

      {screen==='learn'&&!gameCtx&&<LearningHub profile={profile} gameScores={gameScores} onBack={()=>setScreen('home')} onGame={(cat,game)=>setGameCtx({cat,game})}/>}

      {screen==='learn'&&gameCtx&&<GameScreen catKey={gameCtx.cat} gameId={gameCtx.game} profile={profile} gameScores={gameScores} onBack={()=>setGameCtx(null)} onComplete={(score,total)=>{handleGameComplete(gameCtx.cat,gameCtx.game,score,total);setGameCtx(null);}}/>}

      {screen==='parent'&&<ParentDashboard profiles={profiles} pts={pts} done={done} awarded={awarded} customTasks={customTasks} scheduleHours={scheduleHours} onResetPts={handleResetPts} onSaveCustomTasks={handleSaveCustomTasks} onSaveSchedule={handleSaveSchedule} onBack={()=>setScreen('home')}/>}

      {screen!=='parent'&&<BottomNav screen={screen} onNav={handleNav}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
